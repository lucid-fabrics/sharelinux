app-id: io.github.sharelinux.ScreenSharing
runtime: org.gnome.Platform
# GNOME 50 ships libadwaita 1.9 and GTK 4.22. The viewer needs libadwaita 1.7
# (AdwToggleGroup) and GTK 4.14.
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.golang
command: sharelinux

finish-args:
  # Reach the Mac (TCP 5900) and browse _rfb._tcp with the built-in mDNS client.
  - --share=network
  # X11 shared memory for the fallback X11 socket.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # The picture is drawn by the GPU, and the Mac's video is decoded on it (VA-API) and handed
  # to GTK as a DMA-BUF. The group that owns /dev/dri/renderD128 (render or video) shows up
  # as nobody inside the sandbox, which is fine: the kernel still checks the real group.
  #
  # The HEVC decoder is not in the runtime's libavcodec: it comes from the runtime's
  # org.freedesktop.Platform.codecs-extra//25.08-extra extension (libavcodec 61 with HEVC), and the
  # VA-API driver from org.freedesktop.Platform.VAAPI.Intel//25.08 (intel-media-driver, mounted in
  # /usr/lib/x86_64-linux-gnu/dri/intel-vaapi-driver, found by libva on its own). Both are
  # extension points of org.gnome.Platform, so nothing is declared here; flatpak installs them with
  # the app (the Intel one only on a machine with an Intel GPU). HDR video is HEVC 4:4:4 10-bit: the
  # same two extensions decode it on the GPU (VA-API for the Main444_10 profile on Gen12 and newer;
  # software decoding is too slow for it, so HDR is offered with VA-API only). Without codecs-extra the viewer
  # starts and draws picture tiles. The GPU's own Mesa (Vulkan, VA-API for AMD) comes from
  # org.freedesktop.Platform.GL.default.
  - --device=dri
  # The Mac's sound is decoded with libavcodec (the AAC decoder is in the runtime) and played through
  # the sound server's PulseAudio socket, which PipeWire answers too (pipewire-pulse).
  - --socket=pulseaudio
  # Saved Mac passwords live in the system keyring (Secret Service).
  - --talk-name=org.freedesktop.secrets
  # The default folder for "Files from the Mac" is Downloads. Any other folder is
  # chosen through the file chooser portal, and files sent to the Mac come from the
  # file chooser or a drag, so nothing else on disk is opened up.
  - --filesystem=xdg-download

build-options:
  append-path: /usr/lib/sdk/golang/bin
  env:
    CGO_ENABLED: '1'
    GOTOOLCHAIN: local
    GOFLAGS: -mod=vendor -trimpath
    GOPATH: /run/build/sharelinux/go

modules:
  - name: sharelinux
    buildsystem: simple
    build-commands:
      - go build -o /app/bin/sharelinux ./cmd/sharelinux
      - install -Dm644 cmd/sharelinux/data/io.github.sharelinux.ScreenSharing.svg /app/share/icons/hicolor/scalable/apps/io.github.sharelinux.ScreenSharing.svg
      - install -Dm644 cmd/sharelinux/data/io.github.sharelinux.ScreenSharing.desktop /app/share/applications/io.github.sharelinux.ScreenSharing.desktop
      - install -Dm644 cmd/sharelinux/data/io.github.sharelinux.ScreenSharing.metainfo.xml /app/share/metainfo/io.github.sharelinux.ScreenSharing.metainfo.xml
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - .idea
          - .verify
          - Frameworks
          - OpenScreenSharing
          - OpenScreenSharing.xcodeproj
          - OpenScreenSharingUITests
          - assets
          - build
          - dist
          - examples
          - libsharing
          - packaging
      # Go modules, from `go mod vendor` (see build.sh). The build has no network.
      - type: archive
        path: vendor.tar.xz
        dest: vendor
        strip-components: 0
